apiVersion: v1
kind: Service
metadata:
  name: fcg-payments-service
  namespace: fcg-payments
  labels:
    app: fcg-payments
spec:
  type: NodePort
  selector:
    app: fcg-payments
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30000
      protocol: TCP
      name: http
  sessionAffinity: None
