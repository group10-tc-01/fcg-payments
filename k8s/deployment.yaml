apiVersion: apps/v1
kind: Deployment
metadata:
  name: fcg-payments
  namespace: fcg-payments
  labels:
    app.kubernetes.io/name: fcg-payments
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fcg-payments
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fcg-payments
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: fcg-payments-sa
      containers:
        - name: fcg-payments
          image: fcgacrfiap2026.azurecr.io/fcg-payments:main
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: fcg-payments-config
          env:
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: fcg-payments-secrets
                  key: ConnectionStrings__DefaultConnection
            - name: JwtSettings__SecretKey
              valueFrom:
                secretKeyRef:
                  name: fcg-payments-secrets
                  key: JwtSettings__SecretKey
            - name: KafkaSettings__SaslPassword
              valueFrom:
                secretKeyRef:
                  name: fcg-payments-secrets
                  key: KafkaSettings__SaslPassword
            - name: MongoDbSettings__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: fcg-payments-secrets
                  key: MongoDbSettings__ConnectionString
          volumeMounts:
            - name: secrets-store
              mountPath: "/mnt/secrets-store"
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: fcg-payments-secrets
