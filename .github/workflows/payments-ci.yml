name: Payments CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write
  security-events: write

jobs:
  ci:
    uses: group10-tc-01/fcg-pipelines/.github/workflows/dotnet-service-ci.yml@main
    with:
      service_name: payments
      dotnet_version: 8.0.x
      solution_path: FCG.Payments.slnx
      unit_tests_path: tests/FCG.Payments.UnitTests/FCG.Payments.UnitTests.csproj
      integration_tests_path: tests/FCG.Payments.IntegratedTests/FCG.Payments.IntegratedTests.csproj
      test_environment: Test
      coverage_threshold: 80
      run_sonar: true
      sonar_project_key: group10-tc-01_fcg-payments
      sonar_organization: group10-tc-01
      dockerfile_path: src/FCG.Payments.WebApi/Dockerfile
      docker_context: .
    secrets: inherit
