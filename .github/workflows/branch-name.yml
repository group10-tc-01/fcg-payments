name: Payments Branch Policy

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  branch-name:
    uses: group10-tc-01/fcg-pipelines/.github/workflows/branch-name-check.yml@main
    with:
      allowed_pattern: ^(feature|release|hotfix)\/.+$
      allow_main: false
