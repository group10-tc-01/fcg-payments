services:
    otel-collector:
        image: otel/opentelemetry-collector-contrib:0.127.0
        container_name: otel-collector
        command: ["--config=/etc/otelcol-contrib/config.yaml"]
        volumes:
            - ./observability/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
        ports:
            - "4317:4317"
            - "4318:4318"
            - "9464:9464"
        networks:
            - network-fcg

    loki:
        image: grafana/loki:3.5.0
        container_name: loki
        command: ["-config.file=/etc/loki/config.yaml"]
        volumes:
            - ./observability/loki-config.yaml:/etc/loki/config.yaml:ro
            - loki_data:/loki
        ports:
            - "3100:3100"
        networks:
            - network-fcg

    tempo:
        image: grafana/tempo:2.8.1
        container_name: tempo
        command: ["-config.file=/etc/tempo/config.yaml"]
        volumes:
            - ./observability/tempo-config.yaml:/etc/tempo/config.yaml:ro
            - tempo_data:/var/tempo
        ports:
            - "3200:3200"
        networks:
            - network-fcg

    prometheus:
        image: prom/prometheus:v3.4.1
        container_name: prometheus
        command:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --web.enable-remote-write-receiver
        volumes:
            - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - prometheus_data:/prometheus
        ports:
            - "9090:9090"
        depends_on:
            - otel-collector
        networks:
            - network-fcg

    grafana:
        image: grafana/grafana:12.0.1
        container_name: grafana
        environment:
            - GF_SECURITY_ADMIN_USER=admin
            - GF_SECURITY_ADMIN_PASSWORD=admin
        volumes:
            - grafana_data:/var/lib/grafana
            - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
            - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
        ports:
            - "3000:3000"
        depends_on:
            - loki
            - tempo
            - prometheus
        networks:
            - network-fcg

    sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        container_name: sqlserver-fcg
        environment:
            - ACCEPT_EULA=Y
            - SA_PASSWORD=YourPassword123
            - MSSQL_PID=Developer
            - MSSQL_DATABASE=fcg_payments
        ports:
            - "1433:1433"
        volumes:
            - sqlserver_data:/var/opt/mssql
        networks:
            - network-fcg
        healthcheck:
            test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "YourPassword123" -Q "SELECT 1" -C || exit 1
            interval: 10s
            timeout: 3s
            retries: 10
            start_period: 10s

    seq:
        image: datalust/seq:latest
        container_name: seq-fcg
        environment:
            - ACCEPT_EULA=Y
            - SEQ_FIRSTRUN_ADMINPASSWORD=YourPassword123
        ports:
            - "5341:5341"
            - "5342:80"
        networks:
            - network-fcg

    fcg-payments:
        build:
            context: .
            dockerfile: src/FCG.Payments.WebApi/Dockerfile
        container_name: fcg-payments
        depends_on:
            sqlserver:
                condition: service_healthy
            seq:
                condition: service_started
            otel-collector:
                condition: service_started
            kafka:
                condition: service_healthy
        ports:
            - "5054:8080"
            - "5055:8081"
        environment:
            - ASPNETCORE_ENVIRONMENT=Docker
            - ASPNETCORE_URLS=http://+:8080;http://+:8081
        networks:
            - network-fcg
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s
        logging:
            driver: "json-file"
            options:
                max-size: "10m"
                max-file: "3"

    zookeeper:
        image: confluentinc/cp-zookeeper:7.5.0
        container_name: zookeeper
        ports:
            - "2181:2181"
        environment:
            ZOOKEEPER_CLIENT_PORT: 2181
            ZOOKEEPER_TICK_TIME: 2000
        volumes:
            - zookeeper_data:/var/lib/zookeeper/data
            - zookeeper_logs:/var/lib/zookeeper/log
        networks:
            - network-fcg

    kafka:
        image: confluentinc/cp-kafka:7.5.0
        container_name: kafka
        depends_on:
            - zookeeper
        ports:
            - "9092:9092"
            - "29092:29092"
        environment:
            KAFKA_BROKER_ID: 1
            KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
            KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
            KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
            KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
        volumes:
            - kafka_data:/var/lib/kafka/data
        networks:
            - network-fcg
        restart: always
        healthcheck:
            test: kafka-broker-api-versions --bootstrap-server kafka:9092 || exit 1
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

    kafka-ui:
        image: provectuslabs/kafka-ui:latest
        container_name: kafka-ui
        ports:
            - "8081:8080"
        environment:
            KAFKA_CLUSTERS_0_NAME: local
            KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
            KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
            KAFKA_CLUSTERS_0_READONLY: "false"
            DYNAMIC_CONFIG_ENABLED: "true"
        depends_on:
            - kafka
        networks:
            - network-fcg

volumes:
    grafana_data:
    loki_data:
    prometheus_data:
    sqlserver_data:
    tempo_data:
    zookeeper_data:
    zookeeper_logs:
    kafka_data:

networks:
    network-fcg:
        driver: bridge
